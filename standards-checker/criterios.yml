- id: IA-04
  seccion: Excepciones
  descripcion: 'El manejo de errores es consistente: excepciones tipadas mapeadas al codigo HTTP correcto.'
  tipo: ia
  verificacion: Revisar GlobalExceptionHandler y excepciones custom.
  que_cambiar: 'Revisar a mano que el manejo de errores sea consistente: excepcion tipada -> codigo HTTP correcto -> cuerpo estandar.'
  donde_esperado: infrastructure/exception.
  opciones:
  - 'Pregunta guia: cada excepcion de negocio tiene su handler y devuelve el mismo formato (ErrorMessage)?'
  - 'Opcion A: unificar el cuerpo de error en ErrorMessage y revisar que 404/400/409/500 se usen segun el tipo.'
  ejemplo: ResourceNotFoundException -> 404, regla de negocio violada -> 400, duplicado -> 409, inesperado -> 500 (todos con ErrorMessage)
